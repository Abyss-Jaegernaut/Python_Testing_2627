<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking for {{competition['name']}} || GUDLFT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50/70 text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6 antialiased">
    <div class="w-full max-w-lg">
        
        <!-- Booking Card -->
        <div class="bg-white border border-slate-200/90 rounded-2xl shadow-xl shadow-slate-200/50 p-6 sm:p-8 space-y-6">
            
            <div class="border-b border-slate-100 pb-4">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 ring-1 ring-indigo-600/20 mb-2">
                    Formulaire de réservation
                </span>
                <h2 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">{{competition['name']}}</h2>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">Club : <span class="font-semibold text-slate-800">{{club['name']}}</span></p>
            </div>

            <!-- Availability & Points Banner -->
            <div class="grid grid-cols-2 gap-3 p-4 rounded-xl bg-slate-50 border border-slate-200/80">
                <div>
                    <span class="text-xs uppercase font-semibold text-slate-500 tracking-wider">Disponibilité</span>
                    <div class="text-sm sm:text-base font-bold text-emerald-600 mt-0.5">
                        Places available: {{competition['numberOfPlaces']}}
                    </div>
                </div>
                <div>
                    <span class="text-xs uppercase font-semibold text-slate-500 tracking-wider">Solde club</span>
                    <div class="text-sm sm:text-base font-bold text-indigo-600 mt-0.5">
                        {{club['points']}} points
                    </div>
                </div>
            </div>

            <form action="/purchasePlaces" method="post" class="space-y-4">
                <input type="hidden" name="club" value="{{club['name']}}">
                <input type="hidden" name="competition" value="{{competition['name']}}">

                <div>
                    <label for="places" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">How many places?</label>
                    <input 
                        type="number" 
                        name="places" 
                        id="places" 
                        min="1" 
                        max="12" 
                        required 
                        placeholder="1 à 12"
                        class="w-full px-3.5 py-2.5 bg-slate-50/50 border border-slate-300 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all"
                    />
                    <p class="text-xs text-slate-400 mt-1">Maximum de 12 places par club pour chaque compétition.</p>
                </div>

                <div class="flex flex-col sm:flex-row items-center gap-3 pt-2">
                    <button 
                        type="submit" 
                        class="w-full sm:flex-1 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold text-sm rounded-xl shadow-md shadow-indigo-600/20 transition-all text-center"
                    >
                        Book
                    </button>
                    <a 
                        href="{{ url_for('showSummary') }}" 
                        class="w-full sm:w-auto py-2.5 px-4 text-xs sm:text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-xl transition-colors text-center"
                    >
                        Annuler et retourner au sommaire
                    </a>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
